server {
    listen 700;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # O frontend chama a API em api.vagacar.kamehouse.com.br (apiUrl absoluto
    # no environment.prod.ts), então não há proxy /api aqui.

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000";
    }
}
